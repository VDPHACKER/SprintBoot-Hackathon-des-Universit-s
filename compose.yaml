# Messagerie souveraine : pile complète. Démarrage : docker compose up -d --wait
name: messagerie-souveraine

x-synapse-image: &synapse-image ghcr.io/element-hq/synapse:v1.164.1

services:
  # Génère les secrets (une seule fois) et rend les configurations. Aucun accès réseau.
  init:
    image: *synapse-image
    user: "0:0"
    entrypoint: ["bash", "/scripts/init-stack.sh"]
    environment:
      SERVER_NAME: ${SERVER_NAME:-chat.localhost}
      CHAT_PORT: ${CHAT_PORT:-8080}
      DEMO_ACCOUNTS: ${DEMO_ACCOUNTS:-true}
    volumes:
      - ./scripts:/scripts:ro
      - ./deploy/synapse:/templates:ro
      - ./deploy/keycloak:/kc-templates:ro
      - ./data/secrets:/secrets
      - ./data/synapse:/data
      - ./data/keycloak:/kc-import
    network_mode: none

  postgres:
    image: postgres:17.11-alpine
    restart: unless-stopped
    depends_on:
      init: { condition: service_completed_successfully }
    environment:
      POSTGRES_USER: synapse
      POSTGRES_DB: synapse
      POSTGRES_PASSWORD_FILE: /secrets/postgres_password
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./data/secrets:/secrets:ro
      - ./deploy/postgres/10-keycloak.sh:/docker-entrypoint-initdb.d/10-keycloak.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U synapse -d synapse"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Identité: mot de passe + TOTP obligatoire, rôles. Joint par Caddy (:8081) et par les services internes.
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
    entrypoint:
      - /bin/bash
      - -c
      - |
        export KC_DB_PASSWORD="$$(cat /secrets/keycloak_db_password)"
        export KC_BOOTSTRAP_ADMIN_PASSWORD="$$(cat /secrets/keycloak_admin_password)"
        exec /opt/keycloak/bin/kc.sh start --import-realm
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_HOSTNAME: http://auth.localhost:8081
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_HEALTH_ENABLED: "true"
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
    volumes:
      - ./data/secrets:/secrets:ro
      - ./data/keycloak:/opt/keycloak/data/import:ro
    healthcheck:
      test:
        - CMD-SHELL
        - |
          exec 3<>/dev/tcp/127.0.0.1/8080 && echo -e 'GET /realms/bf/.well-known/openid-configuration HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 && head -n 1 <&3 | grep -q ' 200 '
      interval: 10s
      timeout: 5s
      retries: 40
      start_period: 60s

  synapse:
    image: *synapse-image
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
      keycloak: { condition: service_healthy }
      caddy: { condition: service_started }
    environment:
      SYNAPSE_CONFIG_PATH: /data/homeserver.yaml
    volumes:
      - ./data/synapse:/data

  # Crée le compte de service @svc-admin et enregistre son jeton (utilisé par le service d'administration).
  bootstrap:
    image: *synapse-image
    user: "0:0"
    entrypoint: ["python", "/scripts/bootstrap-admin.py"]
    depends_on:
      synapse: { condition: service_healthy }
    environment:
      SERVER_NAME: ${SERVER_NAME:-chat.localhost}
    volumes:
      - ./scripts:/scripts:ro
      - ./data/secrets:/secrets

  # Service d'administration: enrôlement, révocation, annuaire. Joint Synapse et Keycloak par le réseau interne.
  admin:
    build: ./admin-service
    restart: unless-stopped
    depends_on:
      synapse: { condition: service_healthy }
      keycloak: { condition: service_healthy }
      bootstrap: { condition: service_completed_successfully }
    environment:
      SERVER_NAME: ${SERVER_NAME:-chat.localhost}
      SYNAPSE_URL: http://synapse:8008
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_ISSUER: http://auth.localhost:8081/realms/bf
      DEMO_ACCOUNTS: ${DEMO_ACCOUNTS:-true}
      SECRETS_DIR: /secrets
    volumes:
      - ./data/secrets:/secrets:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/health"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Point d'entrée public. Il porte l'alias auth.localhost pour que Synapse atteigne Keycloak par la même URL que le navigateur.
  caddy:
    image: caddy:2.11.7-alpine
    restart: unless-stopped
    depends_on:
      keycloak: { condition: service_healthy }
    ports:
      - "${CHAT_PORT:-8080}:8080"
      - "8081:8081"
    networks:
      default:
        aliases:
          - auth.localhost
    volumes:
      - ./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro

volumes:
  pgdata: