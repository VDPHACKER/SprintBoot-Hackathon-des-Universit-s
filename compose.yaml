# Messagerie souveraine : pile complète. Démarrage : docker compose up -d --wait
name: messagerie-souveraine

x-synapse-image: &synapse-image ghcr.io/element-hq/synapse:v1.164.1

services:
  # Génère les secrets (une seule fois) et rend la configuration Synapse. Aucun accès réseau.
  init:
    image: *synapse-image
    user: "0:0"
    entrypoint: ["bash", "/scripts/init-stack.sh"]
    environment:
      SERVER_NAME: ${SERVER_NAME:-chat.localhost}
      CHAT_PORT: ${CHAT_PORT:-8080}
    volumes:
      - ./scripts:/scripts:ro
      - ./deploy/synapse:/templates:ro
      - ./data/secrets:/secrets
      - ./data/synapse:/data
    network_mode: none

  postgres:
    image: postgres:17.11-alpine
    restart: unless-stopped
    depends_on:
      init: { condition: service_completed_successfully }
    environment:
      POSTGRES_USER: synapse
      POSTGRES_DB: synapse
      POSTGRES_PASSWORD_FILE: /secrets/postgres_password
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./data/secrets:/secrets:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U synapse -d synapse"]
      interval: 5s
      timeout: 5s
      retries: 20

  synapse:
    image: *synapse-image
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      SYNAPSE_CONFIG_PATH: /data/homeserver.yaml
    volumes:
      - ./data/synapse:/data

  # Crée le compte de service @svc-admin et enregistre son jeton (utilisé par le service d'administration).
  bootstrap:
    image: *synapse-image
    entrypoint: ["python", "/scripts/bootstrap-admin.py"]
    depends_on:
      synapse: { condition: service_healthy }
    environment:
      SERVER_NAME: ${SERVER_NAME:-chat.localhost}
    volumes:
      - ./scripts:/scripts:ro
      - ./data/secrets:/secrets

  caddy:
    image: caddy:2.11.7-alpine
    restart: unless-stopped
    depends_on:
      synapse: { condition: service_healthy }
      bootstrap: { condition: service_completed_successfully }
    ports:
      - "${CHAT_PORT:-8080}:8080"
    volumes:
      - ./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro

volumes:
  pgdata: